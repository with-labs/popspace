# Run PopSpace locally or on a server:
#   cp .env.example .env   # then edit credentials
#   docker compose up -d --build
#
# The bundled LiveKit server is in the "livekit" profile, enabled by
# COMPOSE_PROFILES=livekit in .env. Remove that line to use your own
# LiveKit / Twilio account instead.
services:
  popspace:
    build: .
    image: ${POPSPACE_IMAGE:-popspace:local}
    env_file: .env
    environment:
      # container paths always point at the persistent /data volume
      NODE_ENV: production
      DATABASE_URL: file:/data/db.sqlite?connection_limit=1
      UNICORN_DATABASE_URL: /data/unicorn.sqlite
      USER_FILES_DIRECTORY: /data/user-files
      WALLPAPERS_DIRECTORY: /data/wallpapers
    ports:
      - "8888:8888" # UI
      - "8889:8889" # API
      - "8890:8890" # socket server (hermes)
      - "8891:8891" # collaborative documents (unicorn)
    volumes:
      - popspace-data:/data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8.0
    profiles: ["livekit"]
    # dev mode uses the fixed key pair devkey / secret
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880" # signaling
      - "7881:7881" # WebRTC over TCP
      - "7882:7882/udp" # WebRTC over UDP
    restart: unless-stopped

volumes:
  popspace-data:
