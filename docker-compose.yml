# Run PopSpace locally or on a server:
#   cp .env.example .env   # then edit credentials
#   docker compose up -d --build
#
# The bundled LiveKit server is in the "livekit" profile, enabled by
# COMPOSE_PROFILES=livekit in .env. Remove that line to use your own
# LiveKit server instead.
services:
  popspace:
    build:
      context: .
      args:
        REACT_APP_SERVICE_PATHS: ${REACT_APP_SERVICE_PATHS:-}
    image: ${POPSPACE_IMAGE:-popspace:local}
    env_file: .env
    environment:
      # container paths always point at the persistent /data volume
      NODE_ENV: production
      DATABASE_URL: file:/data/db.sqlite?connection_limit=1
      UNICORN_DATABASE_URL: /data/unicorn.sqlite
      USER_FILES_DIRECTORY: /data/user-files
      WALLPAPERS_DIRECTORY: /data/wallpapers
    # BIND_ADDRESS=127.0.0.1 keeps these reachable only by a local reverse proxy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8888:8888" # UI
      - "${BIND_ADDRESS:-0.0.0.0}:8889:8889" # API
      - "${BIND_ADDRESS:-0.0.0.0}:8890:8890" # socket server (hermes)
      - "${BIND_ADDRESS:-0.0.0.0}:8891:8891" # collaborative documents (unicorn)
    volumes:
      - popspace-data:/data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: ["livekit"]
    # API key and secret come from LIVEKIT_API_KEY / LIVEKIT_SECRET_KEY in .env
    command: --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_SECRET_KEY:-secret}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:7880:7880" # signaling
      # media must stay public, browsers connect to these directly
      - "7881:7881" # WebRTC over TCP
      - "7882:7882/udp" # WebRTC over UDP
    restart: unless-stopped

volumes:
  popspace-data:
